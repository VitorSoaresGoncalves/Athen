name: CI

on:
  pull_request:
    branches:
      - 'sprint*'
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.x
          cache: npm
          cache-dependency-path: codigo-base/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:run
      - name: Test typecheck
        run: npm run test:check
      - name: Build
        run: npm run build

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.x
          cache: npm
          cache-dependency-path: codigo-base/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: ${{ !success() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: codigo-base/playwright-report
          if-no-files-found: ignore