name: CI

on:
  pull_request:
    branches:
      - 'sprint*'
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.x
          cache: npm
          cache-dependency-path: codigo-base/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:run
      - name: Test typecheck
        run: npm run test:check
      - name: Build
        run: npm run build

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.x
          cache: npm
          cache-dependency-path: codigo-base/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: ${{ !success() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            codigo-base/playwright-report
            codigo-base/test-results
          if-no-files-found: ignore

  integration:
    name: Supabase local integration
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.x
          cache: npm
          cache-dependency-path: codigo-base/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start disposable Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$RUNNER_TEMP/athen-supabase-start.log" 2>&1
      - name: SQL integration tests with rollback
        run: npm run test:db
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real student journey
        run: npm run test:e2e:live
      - name: Upload integration failure evidence
        if: ${{ !success() }}
        uses: actions/upload-artifact@v6
        with:
          name: supabase-integration-results
          path: codigo-base/test-results/live
          if-no-files-found: ignore
      - name: Stop disposable Supabase
        if: always()
        run: npx supabase stop --no-backup
